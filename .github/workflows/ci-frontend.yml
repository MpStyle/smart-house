name: CI Frontend
on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/deploy.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '!frontend/**/[Rr][Ee][Aa][Dd][Mm][Ee]*'
      - '!.github/**/[Rr][Ee][Aa][Dd][Mm][Ee]*'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/deploy.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '!frontend/**/[Rr][Ee][Aa][Dd][Mm][Ee]*'
      - '!.github/**/[Rr][Ee][Aa][Dd][Mm][Ee]*'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-frontend-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify pipeline selection
        run: node --test .github/scripts/sections.test.mjs
      - name: Build and test frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Browser tests, desktop and mobile
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Store verified frontend
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
